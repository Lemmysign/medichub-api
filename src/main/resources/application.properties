spring.application.name=medichub-api

# HTTP server port
server.port=${SERVER_PORT:9091}

# Active profile: 'local' (default) loads application-local.properties (gitignored) which holds
# real local secrets. In production set SPRING_PROFILES_ACTIVE=prod and supply secrets via env vars.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Uploads: bound request size so a large upload cannot exhaust memory (materials are read server-side).
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:30MB}

# Auth abuse protection: max requests per client IP per minute to /api/auth/**.
app.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:20}

# ------------------------------------------------------------------
# Database (Railway Postgres in prod; local Postgres by default)
# ------------------------------------------------------------------
#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medichub}
#spring.datasource.username=${DB_USER:postgres}
#spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medichub}
spring.datasource.username=${DB_USERNAME:postgres}
# No real password here — supplied by application-local.properties (local) or env var (prod).
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate ddl-auto=update for local dev only; Flyway takes over before prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Flyway disabled during early local dev while ddl-auto manages the schema.
# Enable (and add versioned migrations under db/migration) before production.
spring.flyway.enabled=false



# ------------------------------------------------------------------
# Admin (preconfigured platform owner) & frontend origin
# ------------------------------------------------------------------
# No default admin email must be set explicitly so no one can claim admin via a guessable default.
app.admin.email=${ADMIN_EMAIL:}
app.frontend.url=${FRONTEND_URL:http://localhost:5174}



# ------------------------------------------------------------------
# JWT
# ------------------------------------------------------------------
# No default secret supplied by application-local.properties (local) or env var (prod).
# Must be >= 32 bytes (HS256); the app fails fast on startup otherwise.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-min=${JWT_ACCESS_TTL_MIN:30}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:30}

# ------------------------------------------------------------------
# Google OAuth2
# ------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ------------------------------------------------------------------
# Email (Resend / Brevo SMTP)
# ------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@medichubacademy.com}

# ------------------------------------------------------------------
# Bunny Stream (video)
# ------------------------------------------------------------------
app.bunny.library-id=${BUNNY_LIBRARY_ID:}
app.bunny.api-key=${BUNNY_API_KEY:}
app.bunny.cdn-hostname=${BUNNY_CDN_HOSTNAME:}
app.bunny.token-auth-key=${BUNNY_TOKEN_AUTH_KEY:}

# ------------------------------------------------------------------
# Cloudflare R2 (S3-compatible; AWS S3 SDK)
# ------------------------------------------------------------------
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key=${R2_ACCESS_KEY:}
app.r2.secret-key=${R2_SECRET_KEY:}
app.r2.bucket=${R2_BUCKET:medichub-materials}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# ------------------------------------------------------------------
# Paystack (payments)
# ------------------------------------------------------------------
app.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
app.paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
app.paystack.plan-code=${PAYSTACK_PLAN_CODE:}
app.paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
# Where Paystack redirects the browser after checkout (the SPA verifies the reference)
app.paystack.callback-url=${PAYSTACK_CALLBACK_URL:${app.frontend.url}/subscription/callback}
app.paystack.connect-timeout-ms=${PAYSTACK_CONNECT_TIMEOUT_MS:15000}
app.paystack.read-timeout-ms=${PAYSTACK_READ_TIMEOUT_MS:30000}

# ------------------------------------------------------------------
# Subscription plan (seeded on startup; price is NOT hardcoded set via env).
# Leave price-kobo unset to skip seeding until the real price is configured.
# ------------------------------------------------------------------
app.subscription.plan.name=${SUBSCRIPTION_PLAN_NAME:MedicHub Academy Subscription}
app.subscription.plan.price-kobo=${SUBSCRIPTION_PLAN_PRICE_KOBO:}
app.subscription.plan.currency=${SUBSCRIPTION_PLAN_CURRENCY:NGN}
app.subscription.plan.interval-days=${SUBSCRIPTION_PLAN_INTERVAL_DAYS:30}

# ------------------------------------------------------------------
# Progress tracking topic marked complete once watched >= threshold (CLAUDE.md)
# ------------------------------------------------------------------
app.progress.complete-threshold-seconds=${PROGRESS_COMPLETE_THRESHOLD_SECONDS:30}