# Test profile: an in-memory H2 database (PostgreSQL compatibility mode) so the Spring context
# loads without a running Postgres — used by the @SpringBootTest smoke test and any future
# integration tests, and by CI/Docker builds that run `mvn test`/`package`. No real secrets.

spring.datasource.url=jdbc:h2:mem:medichub;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Dummy, non-secret values so the app's fail-fast startup checks pass under test.
# (JWT secret must be >= 32 bytes for HS256.)
app.jwt.secret=test-only-jwt-secret-key-that-is-at-least-32-bytes-long-000
app.admin.email=admin@test.local
